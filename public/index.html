<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- On phones, use the real screen width instead of pretending to be a desktop page -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Platformer</title>
    <style>
      /* The game fills the whole window. (game.js keeps the canvas's pixels matched to its size.) */
      body { margin: 0; background: #faf8f2; overflow: hidden; }
      #game-area { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; background: #faf8f2; } /* off-white paper (game.js draws the grid on top) */

      /* ===== Join screen: sits on top of the canvas until we press Play ===== */
      /* Same doodle look as the game: off-white paper with a faint blue grid, thick black rounded outlines. */
      #join-screen {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px;
        background-color: #faf8f2;
        background-image:
          linear-gradient(rgba(90, 140, 200, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(90, 140, 200, 0.12) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: sans-serif;
      }
      #join-screen.hidden { display: none; }
      #join-screen h1 { margin: 0; font-size: 40px; }
      #join-screen form { display: flex; gap: 12px; }
      #join-screen input, #join-screen button {
        font: bold 18px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 8px 14px;
        background: #fff;
      }
      #join-screen input { width: 220px; outline: none; }
      #join-screen input:focus { background: #fffbe6; }
      #join-screen button { cursor: pointer; }
      #join-screen button:hover { background: #ffe14d; }
      #join-screen button:active { transform: translateY(2px); }
      #join-screen p { margin: 0; font-size: 13px; color: #555; }

      /* Options: prediction and interpolation on/off, as doodle checkboxes */
      #options { display: flex; gap: 22px; }
      #options label { display: flex; align-items: center; gap: 8px; font: bold 14px sans-serif; cursor: pointer; }
      #options input {
        appearance: none; margin: 0; width: 20px; height: 20px;
        border: 3px solid #000; border-radius: 6px; background: #fff; cursor: pointer;
        display: grid; place-content: center;
      }
      #options input:checked::after { content: ""; width: 10px; height: 10px; border-radius: 3px; background: #000; }
      #options small { font-weight: normal; color: #555; }

      /* Quit: bottom-left corner of the game, only while playing */
      #quit-button {
        position: absolute; left: 10px; bottom: 10px;
        font: bold 14px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 5px 12px; background: #fff; cursor: pointer;
      }
      #quit-button:hover { background: #ffe14d; }
      #quit-button:active { transform: translateY(2px); }
      #quit-button.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="game-area">
      <!-- The canvas is the "drawing board" our game paints onto every frame -->
      <canvas id="game"></canvas>

      <!-- Before playing: type a name and press Play. (The server double-checks the name.) -->
      <div id="join-screen">
        <h1>Platform Tag</h1>
        <form id="join-form">
          <input id="name-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" />
          <button type="submit">Play</button>
        </form>
        <p>Up to 16 letters, numbers, spaces or _</p>
        <!-- Netcode options, to compare how the game feels with and without them -->
        <div id="options">
          <label title="Your character moves the instant you press a key, instead of waiting for the server">
            <input id="prediction-option" type="checkbox" checked /> Prediction <small>(your movement)</small>
          </label>
          <label title="Other players glide smoothly between server updates, instead of jumping">
            <input id="interpolation-option" type="checkbox" checked /> Interpolation <small>(other players)</small>
          </label>
        </div>
      </div>

      <!-- Back to the start screen (hidden until we press Play) -->
      <button id="quit-button" class="hidden" type="button">Quit</button>
    </div>

    <!-- Socket.IO's server automatically serves its browser library at this address -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- The physics, shared with the server, so the browser can predict our own movement -->
    <script src="physics.js"></script>
    <!-- Load the game code after the canvas exists -->
    <script src="game.js"></script>
  </body>
</html>
