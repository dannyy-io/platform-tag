<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- On phones, use the real screen width instead of pretending to be a desktop page -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Platformer</title>
    <style>
      /* The game fills the whole window. (game.js keeps the canvas's pixels matched to its size.) */
      body { margin: 0; background: #faf8f2; overflow: hidden; }
      #game-area { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; background: #faf8f2; } /* off-white paper (game.js draws the grid on top) */

      /* ===== Join screen: sits on top of the canvas until we press Play ===== */
      /* Same doodle look as the game: off-white paper with a faint blue grid, thick black rounded outlines. */
      #join-screen {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px;
        background-color: #faf8f2;
        background-image:
          linear-gradient(rgba(90, 140, 200, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(90, 140, 200, 0.12) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: sans-serif;
      }
      #join-screen.hidden { display: none; }
      #join-screen h1 { margin: 0; font-size: 40px; }
      #join-screen form { display: flex; gap: 12px; }
      #join-screen input, #join-screen button {
        font: bold 18px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 8px 14px;
        background: #fff;
      }
      #join-screen input { width: 220px; outline: none; }
      #join-screen input:focus { background: #fffbe6; }
      #join-screen button { cursor: pointer; }
      #join-screen button:hover { background: #ffe14d; }
      #join-screen button:active { transform: translateY(2px); }
      #join-screen p { margin: 0; font-size: 13px; color: #555; }
      #join-screen #join-error { font: bold 16px sans-serif; color: red; min-height: 20px; } /* keeps its space so nothing jumps */

      /* Options: prediction and interpolation on/off, as doodle checkboxes */
      #options { display: flex; gap: 22px; }
      #options label { display: flex; align-items: center; gap: 8px; font: bold 14px sans-serif; cursor: pointer; }
      #options input {
        appearance: none; margin: 0; width: 20px; height: 20px;
        border: 3px solid #000; border-radius: 6px; background: #fff; cursor: pointer;
        display: grid; place-content: center;
      }
      #options input:checked::after { content: ""; width: 10px; height: 10px; border-radius: 3px; background: #000; }
      #options small { font-weight: normal; color: #555; }

      /* Menu and Keys: stacked in the bottom-left corner of the game, only while playing */
      #menu-button, #keys-button, #sound-button {
        position: absolute; left: 10px; bottom: 10px;
        font: bold 14px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 5px 12px; background: #fff; cursor: pointer;
      }
      #keys-button { bottom: 50px; } /* just above Menu */
      #menu-button:hover, #keys-button:hover, #sound-button:hover { background: #ffe14d; }
      #menu-button:active, #keys-button:active, #sound-button:active { transform: translateY(2px); }
      #menu-button.hidden, #keys-button.hidden, #sound-button.hidden { display: none; }

      /* Key guide: shown over the game the first time you press Play (see game.js).
         Clicks pass through everywhere except the button, so you can play while it's up. */
      #key-guide {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 14px 20px;
        background: #fff; border: 3px solid #000; border-radius: 12px;
        font: 15px sans-serif;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #key-guide.hidden { opacity: 0; visibility: hidden; }
      #key-guide h2 { margin: 0; font-size: 18px; }
      #key-guide table { border-spacing: 10px 6px; }
      #key-guide td:first-child { text-align: right; white-space: nowrap; }
      #key-guide kbd {
        display: inline-block; min-width: 18px; padding: 2px 7px; text-align: center;
        font: bold 13px sans-serif;
        border: 2px solid #000; border-bottom-width: 4px; border-radius: 6px; background: #fffbe6;
      }
      #key-guide button {
        pointer-events: auto;
        font: bold 14px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 4px 14px; background: #fff; cursor: pointer;
      }
      #key-guide button:hover { background: #ffe14d; }

      /* Sound settings: a card in the middle of the screen, opened from the start screen or in-game */
      #sound-button { bottom: 90px; } /* just above Keys */
      #sound-panel {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: flex; flex-direction: column; gap: 14px;
        padding: 16px 22px;
        background: #fff; border: 3px solid #000; border-radius: 12px;
        font: bold 15px sans-serif;
      }
      #sound-panel.hidden { display: none; }
      #sound-panel h2 { margin: 0; font-size: 18px; text-align: center; }
      #sound-panel label { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      #sound-panel input[type="range"] { width: 180px; accent-color: #000; cursor: pointer; }
      #sound-panel .buttons { display: flex; justify-content: center; gap: 10px; }
      #sound-panel button {
        font: bold 14px sans-serif;
        border: 3px solid #000; border-radius: 10px;
        padding: 4px 14px; background: #fff; cursor: pointer;
      }
      #sound-panel button:hover { background: #ffe14d; }
      #sound-panel button:active { transform: translateY(2px); }
      #mute-button[aria-pressed="true"] { background: #ffe14d; } /* stays lit while muted */
    </style>
  </head>
  <body>
    <div id="game-area">
      <!-- The canvas is the "drawing board" our game paints onto every frame -->
      <canvas id="game"></canvas>

      <!-- Before playing: type a name and press Play. (The server double-checks the name.) -->
      <div id="join-screen">
        <h1>Platform Tag</h1>
        <form id="join-form">
          <input id="name-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" />
          <button type="submit">Play</button>
        </form>
        <p>Up to 16 letters, numbers, spaces or _</p>
        <!-- Filled in by game.js if the server turns the name down -->
        <p id="join-error" role="alert"></p>
        <!-- Netcode options, to compare how the game feels with and without them -->
        <div id="options">
          <label title="Your character moves the instant you press a key, instead of waiting for the server">
            <input id="prediction-option" type="checkbox" checked /> Prediction <small>(your movement)</small>
          </label>
          <label title="Other players glide smoothly between server updates, instead of jumping">
            <input id="interpolation-option" type="checkbox" checked /> Interpolation <small>(other players)</small>
          </label>
        </div>
        <!-- Opens the sound settings below -->
        <button id="sound-menu-button" type="button">Sound</button>
      </div>

      <!-- Back to the start screen (hidden until we press Play) -->
      <button id="menu-button" class="hidden" type="button">Menu</button>
      <!-- Opens (or closes) the key guide below -->
      <button id="keys-button" class="hidden" type="button">Keys</button>
      <!-- Opens (or closes) the sound settings below -->
      <button id="sound-button" class="hidden" type="button">Sound</button>

      <!-- How to play (shown the first time you press Play) -->
      <div id="key-guide" class="hidden">
        <h2>How to play</h2>
        <table>
          <tr><td><kbd>A</kbd> <kbd>D</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd></td><td>Move</td></tr>
          <tr><td><kbd>W</kbd> or <kbd>&uarr;</kbd></td><td>Jump (tap it while touching a yellow orb to jump again in mid-air)</td></tr>
          <tr><td><b style="color: #ff8a3d">&#10095;&#10095;&#10095;</b> <b style="color: #4db8ff">&#8963;&#8963;&#8963;</b></td><td>Powerups: grab one for 3 seconds of extra speed or jump</td></tr>
          <tr><td><kbd>Space</kbd></td><td>Tag someone (when you're <b style="color: red">IT</b>)</td></tr>
        </table>
        <button id="key-guide-close" type="button">Got it</button>
      </div>

      <!-- Sound settings (remembered in this browser, see sound.js) -->
      <div id="sound-panel" class="hidden" role="dialog" aria-label="Sound settings">
        <h2>Sound</h2>
        <label>Music <input id="music-volume" type="range" min="0" max="100" /></label>
        <label>Effects <input id="effects-volume" type="range" min="0" max="100" /></label>
        <div class="buttons">
          <button id="mute-button" type="button" aria-pressed="false">Mute</button>
          <button id="sound-close" type="button">Done</button>
        </div>
      </div>
    </div>

    <!-- Socket.IO's server automatically serves its browser library at this address -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- The physics, shared with the server, so the browser can predict our own movement -->
    <script src="physics.js"></script>
    <!-- Loads and plays the sound effects and music -->
    <script src="sound.js"></script>
    <!-- Load the game code after the canvas exists -->
    <script src="game.js"></script>
  </body>
</html>
